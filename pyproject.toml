[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ovcaq"
version = "0.1.0.dev0"
description = "Orchestration, Visibility, and Control for Agent Queues"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "rich",
    "textual",
]

[project.scripts]
ovcaq = "ovcaq.cli:main"

[dependency-groups]
dev = [
    "hatchling",
    "mypy",
    "packaging",
    "pytest",
    "ruff",
]

[tool.hatch.build.targets.sdist]
include = [
    "/CHANGELOG.md",
    "/LICENSE",
    "/README.md",
    "/docs",
    "/pyproject.toml",
    "/src/ovcaq",
    "/tests",
    "/uv.lock",
]
exclude = [
    "/.cache",
    "/.git",
    "/.github",
    "/.hg",
    "/.mypy_cache",
    "/.pytest_cache",
    "/.ruff_cache",
    "/.svn",
    "/.tox",
    "/.venv",
    "/build",
    "/dist",
    "/docs/dev",
    "**/__pycache__",
    "**/*.py[co]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ovcaq"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
pythonpath = ["tests/packaging", "tests/state", "tests/workflow"]

[tool.ruff]
target-version = "py312"
src = ["src"]
extend-exclude = ["docs/dev/project-management"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/ovcaq"]
